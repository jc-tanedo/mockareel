name: Set up Android build
description: Reuse local toolchains on persistent runners; install pinned versions when missing.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-runner
    # setup-java already reuses installed JDKs. Leave its remote Gradle cache
    # disabled: Gradle keeps dependencies in the persistent runner user home.
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.7'
        channel: stable
        # Persistent runners retain this SDK and pub cache locally. Remote cache
        # hits still download/extract gigabytes and overwrite the warm files.
        cache: false
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        cmdline-tools-version: '13114758'
        log-accepted-android-sdk-licenses: false
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
    - name: Configure build resources
      shell: bash
      run: |
        mkdir -p "$HOME/.gradle"
        # Replace only our settings; persistent runners must not accumulate them.
        touch "$HOME/.gradle/gradle.properties"
        sed -i '/^org\.gradle\.jvmargs=/d; /^org\.gradle\.workers\.max=/d' "$HOME/.gradle/gradle.properties"
        cat >> "$HOME/.gradle/gradle.properties" <<'PROPERTIES'
        org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
        org.gradle.workers.max=2
        PROPERTIES
        chmod +x android/gradlew
        flutter config --no-analytics
        flutter pub get --enforce-lockfile
        python3 - <<'PYTHON'
        import os, pathlib, shutil
        sdk = os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME']
        flutter = pathlib.Path(shutil.which('flutter')).resolve().parent.parent
        pathlib.Path('android/local.properties').write_text(f'sdk.dir={sdk}\nflutter.sdk={flutter}\n')
        PYTHON
