name: Set up SeaweedFS artifact client
description: Install a hash-verified S3 client without system package installation.
runs:
  using: composite
  steps:
    - name: Check preinstalled Python
      id: python
      shell: bash
      run: |
        if command -v python3 >/dev/null 2>&1 && \
           python3 -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' && \
           python3 -m pip --version >/dev/null 2>&1; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'available=false' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      if: steps.python.outputs.available != 'true'
      with:
        python-version: '3.12'
    - name: Install isolated S3 client
      shell: bash
      run: |
        client_dir="$(mktemp -d "$RUNNER_TEMP/mockareel-s3.XXXXXXXX")"
        python3 -m pip install --disable-pip-version-check --no-warn-script-location \
          --require-hashes --target "$client_dir" -r tool/ci/s3-requirements.txt
        echo "PYTHONPATH=$client_dir" >> "$GITHUB_ENV"
