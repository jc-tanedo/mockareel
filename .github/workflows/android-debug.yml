name: Android debug APK
on:
  push:
    branches: [main, work, 'poc/**']
  pull_request:
    branches: [main, work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
      - name: Analyze and test
        run: bash tool/ci/check_android.sh
      - name: Restore optional stable debug signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        run: bash tool/ci/build_apk.sh debug
      - uses: ./.github/actions/setup-s3
        if: github.event_name != 'pull_request'
      - name: Upload APK and checksum to SeaweedFS
        if: github.event_name != 'pull_request'
        env:
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python3 tool/ci/s3_artifacts.py upload --kind debug
      - name: Explain pull-request artifact policy
        if: github.event_name == 'pull_request'
        run: echo 'PR checks and APK build passed. S3 uploads run only on pushes/manual runs so PR code receives no storage credentials.' >> "$GITHUB_STEP_SUMMARY"
