name: Android debug APK
on:
  push:
    branches: [main, work, 'poc/**']
  pull_request:
    branches: [main, work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
      - name: Analyze and test
        run: bash tool/ci/check_android.sh
      - name: Restore optional stable debug signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        run: bash tool/ci/build_apk.sh debug
      - name: Upload APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mockareel-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
