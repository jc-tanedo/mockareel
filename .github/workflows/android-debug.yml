name: Android debug APK
on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
      - name: Analyze and test
        run: bash tool/ci/check_android.sh
      - name: Restore optional stable debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        run: bash tool/ci/build_apk.sh debug
      - name: Upload APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mockareel-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
