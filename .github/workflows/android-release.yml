name: Publish Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (must match pubspec.yaml, e.g. v0.10.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    outputs:
      artifact-attempt: ${{ steps.upload.outputs.attempt }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runner
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tool/ci/release_metadata.py
      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - uses: ./.github/actions/setup-android-build
      - name: Analyze and test
        run: bash tool/ci/check_android.sh
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MOCKAREEL_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/mockareel-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash tool/ci/build_apk.sh release
      - name: Scan release APK for credentials
        run: python3 tool/ci/scan_apk_secrets.py build/app/outputs/flutter-apk/app-release.apk
      - name: Stage release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            cp "docs/releases/$RELEASE_TAG.md" dist/release-notes.md
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mockareel-release.jks"
      - uses: ./.github/actions/setup-s3
      - name: Upload verified release assets to SeaweedFS
        id: upload
        env:
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python3 tool/ci/s3_artifacts.py upload --kind release
  publish:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runner
        with:
          github-cli: 'true'
      - name: Clear previous release artifacts
        run: rm -rf -- dist
      - uses: ./.github/actions/setup-s3
      - name: Download and verify release bundle from SeaweedFS
        env:
          ARTIFACT_ATTEMPT: ${{ needs.build.outputs.artifact-attempt }}
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python3 tool/ci/s3_artifacts.py download --kind release --attempt "$ARTIFACT_ATTEMPT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          # Never replace the assets of an existing published release.
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; publish a new version tag."
            exit 1
          fi
          if [[ -f dist/release-notes.md ]]; then
            cp dist/release-notes.md "$RUNNER_TEMP/release-notes.md"
          else
            printf 'Android release built from `%s`.\n\nDownload the APK below. Verify it with the accompanying SHA-256 file.\n' "$RELEASE_COMMIT" > "$RUNNER_TEMP/release-notes.md"
          fi
          args=(--repo "$GH_REPO" --verify-tag --title "Mockareel $RELEASE_VERSION" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.apk.sha256 "${args[@]}"
