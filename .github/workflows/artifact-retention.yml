name: Retain latest APK artifacts
on:
  workflow_run:
    workflows: [Android debug APK, Publish Android release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: artifact-retention
  cancel-in-progress: false
jobs:
  prune:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      # Use the default branch's trusted cleanup code, including for PR builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runner
        with:
          github-cli: 'true'
      - uses: ./.github/actions/setup-s3
      - name: Check SeaweedFS storage on manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python3 tool/ci/s3_artifacts.py check
      - name: Keep two newest SeaweedFS bundles per build type
        env:
          GH_TOKEN: ${{ github.token }}
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python3 tool/ci/s3_artifacts.py prune
      - name: Keep two newest legacy GitHub bundles per build type
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/ci/prune_artifacts.py
