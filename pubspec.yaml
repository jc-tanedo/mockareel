name: mockareel
description: Create mock app reels from your photos and videos.
publish_to: 'none'
version: 0.10.0+10

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  video_player: ^2.14.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
